<!DOCTYPE html>
<html lang="id">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Singgah — diingetin pas di tempatnya, bukan pas lupa. Titik, Misi, dan Titipan yang muncul saat kamu tiba.">
  <meta name="theme-color" content="#0D2A47">

  <!-- Open Graph -->
  <meta property="og:title" content="Singgah">
  <meta property="og:description" content="Diingetin pas di tempatnya, bukan pas lupa.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Singgah">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Singgah — diingetin pas di tempatnya</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #06101C; }
    #singgah-boot {
      position: fixed; inset: 0; display: grid; place-items: center;
      background: #06101C; color: #E9F0F7;
      font: 600 13px/1.5 "Plus Jakarta Sans", system-ui, sans-serif;
      letter-spacing: .18em; text-transform: uppercase; z-index: 1;
    }
    #singgah-boot .dot {
      width: 9px; height: 9px; margin-right: 9px; border-radius: 50%;
      background: #C94F0E; display: inline-block;
      animation: singgah-pulse 1.2s ease-in-out infinite;
    }
    @keyframes singgah-pulse {
      0%, 100% { opacity: .3; transform: scale(.8); }
      50% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div id="singgah-boot"><span class="dot"></span>Menyiapkan Singgah…</div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('singgah-boot');
      if (boot) boot.remove();
    });
  </script>
</body>
</html>
