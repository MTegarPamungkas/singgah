name: singgah
description: "Singgah - diingetin pas di tempatnya, bukan pas lupa."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.9
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  get_it: ^9.3.0
  go_router: ^18.1.1
  intl: ^0.20.3
  uuid: ^4.6.0
  collection: ^1.19.1
  meta: ^1.19.0
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  connectivity_plus: ^7.3.2
  local_auth: ^3.0.2
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.0.1
  permission_handler: ^13.0.2
  app_links: ^7.2.2
  share_plus: ^13.3.1
  image_picker: ^1.2.4
  package_info_plus: ^10.2.2
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  appwrite: ^28.2.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
        - asset: assets/fonts/InstrumentSerif-Italic.ttf
          style: italic
