name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FLUTTER_VERSION: 3.47.8
  APP_SCHEME: dev.singgah
  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
  ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

jobs:
  release:
    name: Build, deploy, and attach artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Ensure Android SDK platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0" > /dev/null

      - name: Install dependencies
        run: flutter pub get

      - name: Test
        run: flutter test --coverage

      - name: Enforce core coverage
        run: dart run tool/check_core_coverage.dart 80

      - name: Decode Android signing key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/singgah-release.jks
          cat > android/key.properties <<EOF
          storeFile=singgah-release.jks
          storePassword=$ANDROID_STORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build release APK
        env:
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          BASE_URL="${WEB_BASE_URL:-https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}/}"
          flutter build apk --release \
            --dart-define=APPWRITE_ENDPOINT="${{ vars.APPWRITE_ENDPOINT }}" \
            --dart-define=APPWRITE_PROJECT_ID="${{ vars.APPWRITE_PROJECT_ID }}" \
            --dart-define=APP_SCHEME="$APP_SCHEME" \
            --dart-define=WEB_BASE_URL="$BASE_URL"

      - name: Build web
        env:
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          BASE_URL="${WEB_BASE_URL:-https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}/}"
          flutter build web --release --base-href "/${REPO_NAME}/" \
            --dart-define=APPWRITE_ENDPOINT="${{ vars.APPWRITE_ENDPOINT }}" \
            --dart-define=APPWRITE_PROJECT_ID="${{ vars.APPWRITE_PROJECT_ID }}" \
            --dart-define=APP_SCHEME="$APP_SCHEME" \
            --dart-define=WEB_BASE_URL="$BASE_URL"

      - name: Set up Appwrite CLI
        run: npm install --global appwrite-cli

      - name: Configure Appwrite CLI
        env:
          APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ vars.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: |
          appwrite client \
            --endpoint "$APPWRITE_ENDPOINT" \
            --project-id "$APPWRITE_PROJECT_ID" \
            --key "$APPWRITE_API_KEY"
          # appwrite push reads the project from appwrite.config.json, so keep it
          # in sync with the environment-specific project ID.
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('appwrite.config.json','utf8'));c.projectId=process.env.APPWRITE_PROJECT_ID;fs.writeFileSync('appwrite.config.json',JSON.stringify(c,null,4));"

      - name: Push database schema and bucket
        run: |
          appwrite push tables --all --force
          appwrite push buckets --all --force

      - name: Deploy functions
        run: |
          for fn in accept-titipan parse-reminder geocode notify-titipan social send-titipan chat; do
            appwrite push function --function-id "$fn" --activate --force
          done

      - name: Configure function secrets
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OSM_USER_AGENT: ${{ vars.OSM_USER_AGENT }}
        run: bash tool/set_appwrite_function_secrets.sh

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Singgah ${{ github.ref_name }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk




