name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.8
  APP_SCHEME: dev.singgah

jobs:
  build:
    name: Analyze, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Ensure Android SDK platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0" > /dev/null

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test with coverage
        run: flutter test --coverage

      - name: Enforce core coverage
        run: dart run tool/check_core_coverage.dart 80

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error

      - name: Build debug APK
        env:
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          BASE_URL="${WEB_BASE_URL:-https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}/}"
          flutter build apk --debug \
            --dart-define=APPWRITE_ENDPOINT="${{ vars.APPWRITE_ENDPOINT }}" \
            --dart-define=APPWRITE_PROJECT_ID="${{ vars.APPWRITE_PROJECT_ID }}" \
            --dart-define=APP_SCHEME="$APP_SCHEME" \
            --dart-define=FIREBASE_PROJECT_ID="${{ secrets.FIREBASE_PROJECT_ID }}" \
            --dart-define=FIREBASE_APP_ID="${{ secrets.FIREBASE_APP_ID }}" \
            --dart-define=FIREBASE_API_KEY="${{ secrets.FIREBASE_API_KEY }}" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}" \
            --dart-define=WEB_BASE_URL="$BASE_URL"

      - name: Build web
        env:
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          BASE_URL="${WEB_BASE_URL:-https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}/}"
          flutter build web --release --base-href "/${REPO_NAME}/" \
            --dart-define=APPWRITE_ENDPOINT="${{ vars.APPWRITE_ENDPOINT }}" \
            --dart-define=APPWRITE_PROJECT_ID="${{ vars.APPWRITE_PROJECT_ID }}" \
            --dart-define=APP_SCHEME="$APP_SCHEME" \
            --dart-define=FIREBASE_PROJECT_ID="${{ secrets.FIREBASE_PROJECT_ID }}" \
            --dart-define=FIREBASE_APP_ID="${{ secrets.FIREBASE_APP_ID }}" \
            --dart-define=FIREBASE_API_KEY="${{ secrets.FIREBASE_API_KEY }}" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}" \
            --dart-define=WEB_BASE_URL="$BASE_URL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: singgah-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: singgah-web
          path: build/web
          if-no-files-found: error


